<title>سفرة مكة</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: one question per screen, centered card on a pale sky ground; the A4 summary is a paper sheet scaled to fit. */
:root{
  --font-display:'Lalezar','IBM Plex Sans Arabic',system-ui,sans-serif; /* swap for the supplied font */
  --font-body:'IBM Plex Sans Arabic',system-ui,'Segoe UI',Tahoma,sans-serif;
  --bg:#F0FAFF; --surface:#FFFFFF; --surface-2:#E3F2F9; --ink:#24495C; --ink-soft:#587C8F; --line:#C9E2EE;
  --blue:#6AADCB; --on-blue:#123140; --blue-deep:#2F7799; --rose:#F8E4E1; --rose-deep:#9A5A6E; --danger:#A5485A;
  --paper:#FFFFFF; --paper-ink:#24495C; --paper-soft:#6B8C9C; --paper-line:#C4DDEA; --paper-head:#DCEEF6; --paper-pray:#F8E4E1; --paper-pray-ink:#8A4B5F;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1B22; --surface:#15262F; --surface-2:#1C323D; --ink:#E4F2F8; --ink-soft:#9DBBCA; --line:#29424F;
  --blue:#7DBBD6; --on-blue:#0D2430; --blue-deep:#8CC8E2; --rose:#3A2A30; --rose-deep:#EBB9C3; --danger:#F0A3B0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1B22; --surface:#15262F; --surface-2:#1C323D; --ink:#E4F2F8; --ink-soft:#9DBBCA; --line:#29424F;
  --blue:#7DBBD6; --on-blue:#0D2430; --blue-deep:#8CC8E2; --rose:#3A2A30; --rose-deep:#EBB9C3; --danger:#F0A3B0; color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:16px; line-height:1.6; direction:rtl;
  padding-block:20px 40px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); background:var(--bg); z-index:10}
.wrap{max-width:560px; margin:0 auto; display:flex; flex-direction:column; gap:18px; min-width:0}
.wrap.wide{max-width:980px}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:3px solid var(--blue-deep); outline-offset:2px}

.top{display:flex; align-items:center; justify-content:space-between; gap:12px}
.mini-logo{height:44px; width:auto; max-width:50%}
.link-btn{background:none; border:1px solid var(--line); color:var(--ink); border-radius:999px; padding:6px 14px; cursor:pointer; font-size:14px}
.link-btn:hover{background:var(--surface-2)}

.progress{display:flex; flex-direction:column; gap:4px}
.progress-meta{display:flex; justify-content:space-between; font-size:14px; color:var(--ink-soft)}
.road{--bw:78px; --p:0; position:relative; height:50px}
.road::before{content:""; position:absolute; left:0; right:0; bottom:4px; height:6px; border-radius:99px; background:repeating-linear-gradient(to left,var(--line) 0 12px,transparent 12px 20px)}
.road-fill{position:absolute; right:0; bottom:4px; height:6px; border-radius:99px; background:var(--blue); width:calc(var(--bw)*.5 + (100% - var(--bw))*var(--p)); transition:width 1s cubic-bezier(.45,.05,.25,1)}
.road-bus{position:absolute; bottom:6px; width:var(--bw); height:auto; right:calc((100% - var(--bw))*var(--p)); transition:right 1s cubic-bezier(.45,.05,.25,1)}
@keyframes enterUp{from{opacity:0;transform:translateY(56px)}to{opacity:1;transform:none}}
@keyframes enterDown{from{opacity:0;transform:translateY(-56px)}to{opacity:1;transform:none}}
.enter-up{animation:enterUp .42s cubic-bezier(.2,.8,.2,1) backwards}
.enter-down{animation:enterDown .42s cubic-bezier(.2,.8,.2,1) backwards}
.leave-up{transition:transform .26s ease-in,opacity .26s ease-in; transform:translateY(-80px); opacity:0}
.leave-down{transition:transform .26s ease-in,opacity .26s ease-in; transform:translateY(80px); opacity:0}
.swipe-card{touch-action:none; user-select:none; -webkit-user-select:none; cursor:grab}
.swipe-hint{display:flex; flex-direction:column; align-items:center; gap:2px; color:var(--ink-soft); font-size:15px}
.swipe-hint svg{width:30px; height:30px; animation:nudge 1.4s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateY(4px);opacity:.5}50%{transform:translateY(-6px);opacity:1}}
.day-chip{background:var(--rose); color:var(--rose-deep); border-radius:99px; padding:2px 12px; font-weight:600}

.card{background:var(--surface); border:1px solid var(--line); border-radius:22px; padding:26px 22px; display:flex; flex-direction:column; gap:18px; min-width:0}
.card h1,.card h2{font-family:var(--font-display); font-weight:400; margin:0; line-height:1.35; text-wrap:balance}
.card h1{font-size:clamp(28px,7vw,38px)}
.card h2{font-size:clamp(24px,6vw,32px)}
.lead{color:var(--ink-soft); margin:0}
.field{width:100%; border:2px solid var(--line); background:var(--bg); border-radius:14px; padding:12px 14px; font-size:18px}
textarea.field{min-height:120px; resize:vertical}
.field:focus{border-color:var(--blue-deep); outline:none}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.btn{border:0; border-radius:14px; padding:13px 22px; font-weight:700; font-size:17px; cursor:pointer; background:var(--blue); color:var(--on-blue)}
.btn:hover{filter:brightness(.96)}
.btn[disabled]{opacity:.5; cursor:not-allowed}
.btn.ghost{background:transparent; border:1px solid var(--line); color:var(--ink); font-weight:500}
.btn.ghost:hover{background:var(--surface-2)}
.btn.grow{flex:1}
.pray{background:var(--rose); color:var(--rose-deep); border-radius:12px; padding:8px 14px; font-weight:600; align-self:flex-start}
.toggle{display:flex; align-items:center; gap:10px; cursor:pointer; user-select:none}
.toggle input{width:20px; height:20px; accent-color:var(--blue-deep)}
.range-pick{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.range-pick select{border:2px solid var(--line); background:var(--bg); border-radius:12px; padding:8px 12px; min-width:0; max-width:100%}
.hint{font-size:14px; color:var(--ink-soft); margin:0}
.note{font-size:14px; padding:10px 14px; border-radius:12px; background:var(--surface-2); color:var(--ink)}
.note.warn{background:var(--rose); color:var(--rose-deep)}
.swipe{align-self:center; color:var(--ink-soft); font-size:14px}
.big-name{font-family:var(--font-display); color:var(--blue-deep)}

.preview-box{background:var(--surface-2); border-radius:18px; padding:12px; overflow:hidden}
.preview-clip{position:relative; margin:0 auto; overflow:hidden}
.preview-clip .sheet{transform-origin:top right; position:absolute; top:0; right:0}

/* A4 sheet: fixed 794x1123 px so the PDF export matches the page exactly */
.sheet{width:794px; height:1123px; background:var(--paper); color:var(--paper-ink); font-family:var(--font-body); padding:34px 38px 30px; display:flex; flex-direction:column; gap:14px; direction:rtl; line-height:1.35}
.sheet *{box-sizing:border-box}
.sh-head{display:flex; align-items:center; justify-content:space-between; gap:18px; border-bottom:2px solid var(--paper-line); padding-bottom:12px}
.sh-head img{height:84px; width:auto}
.sh-title{text-align:right; direction:rtl}
.sh-title b{font-family:var(--font-display); font-weight:400; font-size:30px; display:block; line-height:1.2}
.sh-title span{font-size:14px; color:var(--paper-soft)}
.sh-body{flex:1; min-height:0; display:flex; flex-direction:column; border:1px solid var(--paper-line); border-radius:10px; overflow:hidden}
.sh-cols,.sh-row{display:grid; grid-template-columns:150px 118px 1fr; align-items:stretch}
.sh-cols{background:var(--paper-head); font-weight:700; font-size:13px; flex:none}
.sh-cols div{padding:5px 8px}
.sh-day{background:var(--paper-head); font-weight:700; padding:3px 10px; font-size:12px; flex:none; border-top:1px solid var(--paper-line)}
.sh-row{flex:1 0 auto; border-top:1px solid var(--paper-line); font-size:var(--fs,13px)}
.sh-row>div{padding:3px 8px; display:flex; align-items:center; min-width:0; overflow-wrap:anywhere}
.sh-row .t{color:var(--paper-soft); font-size:.92em; font-variant-numeric:tabular-nums}
.sh-row .p{gap:4px; flex-wrap:wrap}
.chip-p{background:var(--paper-pray); color:var(--paper-pray-ink); border-radius:6px; padding:0 7px; font-size:.88em; font-weight:600; white-space:nowrap}
.sh-row .x{white-space:pre-wrap}
.sh-row.empty .x{color:var(--paper-soft)}
.sh-foot{font-size:11px; color:var(--paper-soft); text-align:center; flex:none}

/* admin */
.members{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:10px}
.member{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:14px; text-align:right; cursor:pointer; display:flex; flex-direction:column; gap:4px; min-width:0}
.member:hover{border-color:var(--blue-deep)}
.member b{font-size:18px; overflow-wrap:anywhere}
.member span{font-size:14px; color:var(--ink-soft)}
.pill{display:inline-block; font-size:13px; padding:1px 10px; border-radius:99px; background:var(--surface-2); width:fit-content}
.pill.ok{background:var(--blue); color:var(--on-blue)}
.cp-area{width:100%; min-height:140px; border:1px solid var(--line); border-radius:12px; background:var(--bg); padding:10px; font-size:14px}

@media (prefers-reduced-motion: reduce){.road-fill,.road-bus{transition:none}.enter-up,.enter-down,.swipe-hint svg{animation:none}.leave-up,.leave-down{transition:none}}
</style>

var PRAYERS=[
  {day:0,h:5, name:'الفجر', time:'5:15 ص', line:'5:15 صلاة الفجر يا عسل'},
  {day:0,h:12,name:'صلاة الجمعة', time:'12:06 م', line:'12:06 صلاة الجمعة يا عسل'},

  {day:1,h:12,name:'الظهر', time:'12:06 م', line:'12:06 صلاة الظهر يا عسل'}
];
function prayerAt(idx){var s=SLOTS[idx];for(var k=0;k<PRAYERS.length;k++){if(PRAYERS[k].day===s.day&&PRAYERS[k].h===s.h)return PRAYERS[k];}return null;}
function h12(h){return h%12===0?12:h%12;}
function shortLabel(idx){var s=SLOTS[idx];return h12(s.h)+':00 '+(s.h<12?'ص':'م');}
function hourWord(idx){
  var h=SLOTS[idx].h;
  if(h===0) return '12 منتصف الليل';
  var part;
  if(h<=3) part='ليلاً'; else if(h<=5) part='فجراً'; else if(h<12) part='صباحاً';
  else if(h<15) part='ظهراً'; else if(h<17) part='عصراً'; else if(h<19) part='مساءً'; else part='ليلاً';
  return h12(h)+' '+part;
}
function optLabel(idx){return (SLOTS[idx].day===1?'السبت ':'')+hourWord(idx);}

/* ---- sheet building (used for preview, admin and PDF) ---- */
function buildRows(entries){
  var cover=new Array(N),k,e,j;
  for(k=0;k<entries.length;k++){e=entries[k];for(j=e.from;j<=e.to&&j<N;j++)cover[j]=e;}
  var segs=[],idx=0;
  while(idx<N){
    e=cover[idx];
    if(e){
      var a=idx,b=Math.min(e.to,N-1);
      if(a<DAY2&&b>=DAY2){segs.push({a:a,b:DAY2-1,text:e.text});segs.push({a:DAY2,b:b,text:e.text});}
      else segs.push({a:a,b:b,text:e.text});
      idx=b+1;
    } else { segs.push({a:idx,b:idx,text:null}); idx++; }
  }
  return segs;
}
function buildSheet(data){
  var sheet=el('div','sheet');
  var head=el('div','sh-head');
  var img=document.createElement('img');img.src=LOGO;img.alt=TRIP_NAME;
  var tt=el('div','sh-title');
  var b=el('b','', 'خطة '+(data.name||'')); var sp=el('span','', TRIP_NAME+' · '+DATE_LINE+' إلى السبت 21 نوفمبر');
  tt.appendChild(b);tt.appendChild(sp);
  head.appendChild(img);head.appendChild(tt);sheet.appendChild(head);
  var body=el('div','sh-body');
  var cols=el('div','sh-cols');cols.appendChild(el('div','','الوقت'));cols.appendChild(el('div','','الصلاة'));cols.appendChild(el('div','','خطة الساعة'));
  body.appendChild(cols);
  var segs=buildRows(data.entries||[]);var lastDay=-1;
  segs.forEach(function(s){
    var d=SLOTS[s.a].day;
    if(d!==lastDay){body.appendChild(el('div','sh-day','يوم '+DAYNAME[d]+(d===0?' 20 نوفمبر':' 21 نوفمبر')));lastDay=d;}
    var row=el('div','sh-row'+(s.text==null||s.text===''?' empty':''));
    var t=el('div','t', s.a===s.b?shortLabel(s.a):shortLabel(s.a)+' – '+shortLabel(s.b));
    var p=el('div','p');
    for(var q=s.a;q<=s.b;q++){var pr=prayerAt(q);if(pr)p.appendChild(el('span','chip-p',pr.name+' '+pr.time));}
    var x=el('div','x', (s.text==null||s.text==='')?'—':s.text);
    row.appendChild(t);row.appendChild(p);row.appendChild(x);body.appendChild(row);
  });
  sheet.appendChild(body);
  sheet.appendChild(el('div','sh-foot','سفرة مكة · أوقات الصلاة حسب جدول الرحلة'));
  return sheet;
}
function fitSheet(sheet){
  var body=sheet.querySelector('.sh-body');if(!body)return;
  var fs=15;
  for(;fs>=6.5;fs-=0.5){
    sheet.style.setProperty('--fs',fs+'px');
    if(body.scrollHeight<=body.clientHeight+1)break;
  }
}
var resizeFn=null;
function mountPreview(host,data){
  clear(host);
  var box=el('div','preview-box');var clip=el('div','preview-clip');
  var sheet=buildSheet(data);clip.appendChild(sheet);box.appendChild(clip);host.appendChild(box);
  function layout(){
    var w=box.clientWidth-24; if(w<=0)return;
    var sc=Math.min(1,w/794);
    sheet.style.transform='scale('+sc+')';
    clip.style.width=(794*sc)+'px';clip.style.height=(1123*sc)+'px';
  }
  layout();fitSheet(sheet);
  if(resizeFn)window.removeEventListener('resize',resizeFn);
  resizeFn=layout;window.addEventListener('resize',layout);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){fitSheet(sheet);layout();});
}

/* ---- plain text copy ---- */
function planText(data){
  var lines=['خطة '+(data.name||'')+' — '+TRIP_NAME];var lastDay=-1;
  buildRows(data.entries||[]).forEach(function(s){
    var d=SLOTS[s.a].day;if(d!==lastDay){lines.push('');lines.push('يوم '+DAYNAME[d]);lastDay=d;}
    var pr=[];for(var q=s.a;q<=s.b;q++){var p=prayerAt(q);if(p)pr.push(p.name+' '+p.time);}
    lines.push((s.a===s.b?shortLabel(s.a):shortLabel(s.a)+' – '+shortLabel(s.b))+(pr.length?' ('+pr.join('، ')+')':'')+': '+((s.text==null||s.text==='')?'—':s.text));
  });
  return lines.join('\n');
}

/* ---- persistence ---- */
var chain=Promise.resolve(),dirty=false;
function payload(){return {name:S.name,entries:S.entries,pos:S.pos,done:S.done,seenDay2:S.seenDay2,updatedAt:Date.now()};}
function persist(){
  if(S.edit&&!S.done)return;
  lsSet();
  if(!sb||!S.name){return;}
  dirty=true;
  chain=chain.then(function(){
    if(!dirty)return; dirty=false;
    return sb.rpc('save_plan',{p_name:S.name,p_data:payload()}).then(function(res){
      if(res.error){saveState='fail';saveMsg=res.error.message||'';}else{saveState='ok';}
      paintSave();
    });
  });
}
function paintSave(){
  var n=document.getElementById('savenote');if(!n)return;
  n.className='note'+(saveState==='fail'||dbMode==='off'?' warn':'');
  if(dbMode==='off') n.textContent='ما قدرنا نتصل بالمشرف الحين. خطتك محفوظة عندك، وتقدر تنسخها وترسلها له.';
  else if(saveState==='fail') n.textContent='ما انحفظت عند المشرف. تأكد إنك داخل بحسابك، أو انسخ خطتك وأرسلها له.';
  else if(saveState==='ok') n.textContent='تم حفظ خطتك عند المشرف.';
  else n.textContent='جاري الاتصال...';
}

/* ---- resume a plan by name (name-only entry, no accounts) ---- */
function resumeRemote(){
  if(!sb){go('welcome');return;}
  sb.rpc('get_plan',{p_name:S.name}).then(function(res){
    var d=res.data;
    if(!res.error&&d&&Array.isArray(d.entries)&&d.entries.length){
      loadFromData(d);S.started=true;lsSet();go(S.done?'summary':'welcome');
    } else { go('welcome'); }
    persist();
  },function(){go('welcome');});
}

}

  hint.appendChild(el('span','','اسحب للأعلى'));

  });
  c.addEventListener('pointermove',function(e){

  });
  function finish(){

  }

}
var swipeLock=false;
function swipeFromWelcome(){if(S.screen!=='welcome'||swipeLock)return;swipeLock=true;leave('up',function(){swipeLock=false;startQ();});}
window.addEventListener('wheel',function(e){if(e.deltaY>25)swipeFromWelcome();},{passive:true});
window.addEventListener('keydown',function(e){if(S.screen==='welcome'&&(e.key==='ArrowUp'||e.key==='Enter'||e.key===' '))swipeFromWelcome();});
function startQ(){S.started=true;if(S.pos>=N){go('summary');return;}S.draft={text:'',multi:false,to:null};go('q');}

function scrQuestion(){
  var pos=S.pos,slot=SLOTS[pos];
  var prog=el('div','progress');
  var meta=el('div','progress-meta');
  meta.appendChild(el('span','day-chip','يوم '+DAYNAME[slot.day]));

  var P=pos/(N-1);
  var road=el('div','road');road.style.setProperty('--p',String(lastP));
  road.appendChild(el('div','road-fill'));
  var bus=document.createElement('img');bus.className='road-bus';bus.src=BUS;bus.alt='';road.appendChild(bus);
  prog.appendChild(meta);prog.appendChild(road);root.appendChild(prog);
  requestAnimationFrame(function(){requestAnimationFrame(function(){road.style.setProperty('--p',String(P));});});
  lastP=P;

  var c=el('div','card');
  c.appendChild(el('h2','',TEMPLATES[pos%TEMPLATES.length].replace('{t}',hourWord(pos))));
  var pr=prayerAt(pos);if(pr)c.appendChild(el('div','pray',pr.line));
  var ta=document.createElement('textarea');ta.className='field';ta.id='plantxt';ta.placeholder='اكتب اقتراحك (حتى لو نوم)';ta.value=S.draft.text||'';ta.maxLength=300;
  ta.addEventListener('input',function(){S.draft.text=ta.value;});
  c.appendChild(ta);

  var lab=el('label','toggle');var cb=document.createElement('input');cb.type='checkbox';cb.id='multi';cb.checked=!!S.draft.multi;
  lab.appendChild(cb);lab.appendChild(el('span','','أكثر من ساعة'));
  c.appendChild(lab);
  var rp=el('div','range-pick');rp.hidden=!cb.checked;
  rp.appendChild(el('span','','من الساعة '+hourWord(pos)+' إلى'));
  var sel=document.createElement('select');sel.id='toSel';
  for(var j=pos+1;j<N;j++){var o=document.createElement('option');o.value=j;o.textContent=optLabel(j);sel.appendChild(o);}
  sel.value=String(S.draft.to!=null&&S.draft.to>pos?S.draft.to:Math.min(pos+1,N-1));
  S.draft.to=parseInt(sel.value,10);
  sel.addEventListener('change',function(){S.draft.to=parseInt(sel.value,10);});
  rp.appendChild(sel);c.appendChild(rp);
  if(pos===N-1){lab.hidden=true;rp.hidden=true;}
  cb.addEventListener('change',function(){S.draft.multi=cb.checked;rp.hidden=!cb.checked;});

  var r=el('div','row');
  var back=el('button','btn ghost','رجوع');back.type='button';back.addEventListener('click',goBack);
  var nx=el('button','btn grow',pos===N-1?'خلصنا':'التالي');nx.type='button';nx.addEventListener('click',goNext);
  r.appendChild(back);r.appendChild(nx);c.appendChild(r);
  root.appendChild(c);
  setTimeout(function(){try{ta.focus({preventScroll:true});}catch(e){}},50);
}
function goNext(){
  var pos=S.pos;
  var to=(S.draft.multi&&pos<N-1)?Math.max(pos,Math.min(N-1,S.draft.to||pos)):pos;
  S.entries.push({from:pos,to:to,text:(S.draft.text||'').trim()});
  S.pos=to+1;S.draft={text:'',multi:false,to:null};
  if(S.pos>=N){S.done=true;S.edit=null;persist();leave('up',function(){go('summary');});return;}
  S.draft=draftFromOld(S.pos);
  persist();
  if(S.pos===DAY2&&!S.seenDay2){S.seenDay2=true;leave('up',function(){go('day2');});return;}
  leave('up',function(){go('q');});
}
function goBack(){
  if(S.entries.length===0){leave('down',function(){go('welcome');});return;}
  var last=S.entries.pop();
  S.pos=last.from;S.done=false;
  S.draft={text:last.text,multi:last.to>last.from,to:last.to>last.from?last.to:null};
  persist();leave('down',function(){go('q');});
}
function scrDay2(){
  var c=el('div','card');
  c.appendChild(el('h1','','خلصنا يوم الجمعة'));

}

  var c=el('div','card');

  r.appendChild(ed);r.appendChild(cp);c2.appendChild(r);

function goEdit(){
  /* restart the walk-through, prefilled slot by slot from the saved entries */
  var old=S.entries.slice();S.entries=[];S.pos=0;S.done=false;S.edit=old;
  S.draft=draftFromOld(0);go('q');
}
function draftFromOld(pos){
  if(!S.edit)return {text:'',multi:false,to:null};
  for(var k=0;k<S.edit.length;k++){if(S.edit[k].from===pos){var e=S.edit[k];return {text:e.text,multi:e.to>e.from,to:e.to>e.from?e.to:null};}}
  return {text:'',multi:false,to:null};
}

/* ---- admin ---- */
var members=[],unsub=null,adminErr='',openId=null;
var adminOK=false;
function unlocked(){if(adminOK)return true;try{return sessionStorage.getItem('safra-admin-ok')==='1';}catch(e){return false;}}
function showAdmin(){
  if(!unlocked()){S.screen='gate';render();return;}
  openAdmin();
}
var refreshTimer=null;
function adminCode(){try{return sessionStorage.getItem('safra-admin-code')||'';}catch(e){return '';}}
function loadMembers(){
  if(!sb){adminErr='الحفظ غير متاح في هذا العرض.';if(S.screen==='admin')render();return;}
  sb.rpc('admin_plans',{p_code:adminCode()}).then(function(res){
    if(res.error){adminErr='ما قدرنا نقرأ الخطط ('+(res.error.message||'خطأ')+').';}
    else{adminErr='';members=(res.data||[]).map(function(r){var x=Object.assign({},r.data||{});x._id=r.name;x.name=x.name||r.name;return x;});}
    if(S.screen==='admin')render();
  });
}
function openAdmin(){
  adminOK=true;S.screen='admin';openId=null;
  loadMembers();
  if(!refreshTimer)refreshTimer=setInterval(function(){if(S.screen==='admin'&&!openId)loadMembers();},30000);
  render();
}
function answered(entries){var c=0;(entries||[]).forEach(function(e){if(e.text&&String(e.text).trim())c+=Math.max(0,Math.min(e.to,N-1)-e.from+1);});return Math.min(c,N);}
function covered(entries){var c=0;(entries||[]).forEach(function(e){c+=Math.max(0,Math.min(e.to,N-1)-e.from+1);});return Math.min(c,N);}
function ago(ts){if(!ts)return '';var m=Math.round((Date.now()-ts)/60000);if(m<1)return 'الحين';if(m<60)return 'قبل '+m+' دقيقة';var h=Math.round(m/60);if(h<24)return 'قبل '+h+' ساعة';return 'قبل '+Math.round(h/24)+' يوم';}
function scrAdmin(){
  var c=el('div','card');
  var r=el('div','row');
  var back=el('button','btn ghost','رجوع');back.type='button';
  back.addEventListener('click',function(){if(openId){openId=null;render();}else{go(S.done?'summary':(S.started?'welcome':'name'));}});
  r.appendChild(back);c.appendChild(r);
  if(!openId){
    c.appendChild(el('h2','','لوحة المشرف'));
    c.appendChild(el('p','lead','عدد الأعضاء: '+members.length+'. اضغط على أي واحد تشوف خطته.'));
    if(adminErr)c.appendChild(el('div','note warn',adminErr));
    if(!sb)c.appendChild(el('div','note warn','الحفظ غير متاح في هذا العرض.'));
    root.appendChild(c);
    if(members.length===0&&!adminErr){root.appendChild(el('div','note','لسا ما وصلك أحد. أرسل الرابط لأعضاء السفرة وتظهر أسماؤهم هنا.'));return;}
    if(members.length){
      var ra=el('div','row');var all=el('button','btn','تنزيل الكل في PDF واحد');all.type='button';
      var amsg=el('div','note');amsg.hidden=true;
      all.addEventListener('click',function(){downloadMany(members.slice().sort(function(a,b){return (b.updatedAt||0)-(a.updatedAt||0);}),all,amsg,'خطط-سفرة-مكة.pdf');});
      ra.appendChild(all);root.appendChild(ra);root.appendChild(amsg);
    }
    var grid=el('div','members');
    members.slice().sort(function(a,b){return (b.updatedAt||0)-(a.updatedAt||0);}).forEach(function(m){
      var b=el('button','member');b.type='button';
      b.appendChild(el('b','',m.name||'بدون اسم'));
      b.appendChild(el('span','',answered(m.entries)+' من '+N+' ساعة مكتوبة'));
      var p=el('span','pill'+(m.done?' ok':''),m.done?'خلّص':'لسا يكتب');b.appendChild(p);
      b.appendChild(el('span','',ago(m.updatedAt)));
      b.addEventListener('click',function(){openId=m._id;render();});
      grid.appendChild(b);
    });
    root.appendChild(grid);
    return;
  }
  var m=null;members.forEach(function(x){if(x._id===openId)m=x;});
  if(!m){root.appendChild(c);return;}
  c.appendChild(el('h2','','خطة '+(m.name||'')));
  var r2=el('div','row');
  var dl=el('button','btn grow','تنزيل PDF (A4)');dl.type='button';
  var msg=el('div','note');msg.hidden=true;
  dl.addEventListener('click',function(){downloadPdf(m,dl,msg);});
  r2.appendChild(dl);c.appendChild(r2);c.appendChild(msg);
  root.appendChild(c);
  var host=el('div','');root.appendChild(host);
  mountPreview(host,m);
}
function saveBlobPromise(o){return new Promise(function(res){
  var u=URL.createObjectURL(o.data);var a=document.createElement('a');a.href=u;a.download=o.filename;
  document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(u);a.remove();},4000);res({status:'saved'});
});}
function loadScript(src){return new Promise(function(res,rej){var s=document.createElement('script');s.src=src;s.onload=res;s.onerror=function(){rej(new Error('load'));};document.head.appendChild(s);});}
function downloadPdf(m,btn,msg){
  msg.hidden=true;btn.disabled=true;var old=btn.textContent;btn.textContent='جاري التجهيز...';
  var fail=function(t){msg.hidden=false;msg.className='note warn';msg.textContent=t;btn.disabled=false;btn.textContent=old;};
  var libs=Promise.resolve();
  if(!window.html2canvas)libs=libs.then(function(){return loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');});
  if(!(window.jspdf&&window.jspdf.jsPDF))libs=libs.then(function(){return loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');});
  Promise.all([libs,Promise.resolve({save:saveBlobPromise}),(document.fonts&&document.fonts.ready)||Promise.resolve()]).then(function(r){
    var dls=r[1];
    if(!dls){fail('التنزيل غير متاح في هذا العرض. افتح الصفحة من تطبيق Claude أو من الرابط مباشرة.');return;}
    var stage=el('div','');stage.style.cssText='position:fixed;left:-10000px;top:0;';
    var sheet=buildSheet(m);stage.appendChild(sheet);document.body.appendChild(stage);fitSheet(sheet);
    return window.html2canvas(sheet,{scale:2,backgroundColor:'#ffffff',useCORS:true}).then(function(canvas){
      document.body.removeChild(stage);
      var pdf=new window.jspdf.jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
      pdf.addImage(canvas.toDataURL('image/jpeg',0.95),'JPEG',0,0,210,297);
      return dls.save({filename:'خطة-'+(m.name||'عضو')+'.pdf',data:pdf.output('blob')});
    }).then(function(){btn.disabled=false;btn.textContent=old;},function(e){
      if(stage.parentNode)stage.parentNode.removeChild(stage);
      if(e&&e.code==='declined'){btn.disabled=false;btn.textContent=old;return;}
      fail('ما قدرنا ننزل الملف. جرب مرة ثانية.');
    });
  }).catch(function(){fail('ما قدرنا نحمّل أداة الـ PDF. تأكد من الإنترنت وجرب مرة ثانية.');});
}

/* ---- admin gate (4-digit code; real data protection is the db read rule) ---- */
function scrGate(){
  var c=el('div','card');
  var r0=el('div','row');var back=el('button','btn ghost','رجوع');back.type='button';
  back.addEventListener('click',function(){go(S.done?'summary':(S.started?'welcome':'name'));});
  r0.appendChild(back);c.appendChild(r0);
  c.appendChild(el('h2','','لوحة المشرف'));
  c.appendChild(el('p','lead','أدخل الرمز المكون من 4 أرقام.'));
  var inp=document.createElement('input');inp.className='field';inp.id='codeinp';inp.type='password';inp.inputMode='numeric';
  inp.maxLength=4;inp.autocomplete='one-time-code';inp.placeholder='••••';inp.dir='ltr';inp.style.cssText='letter-spacing:.4em;text-align:center';
  c.appendChild(inp);
  var err=el('div','note warn');err.hidden=true;c.appendChild(err);
  var b=el('button','btn','دخول');b.type='button';c.appendChild(b);
  var busy=false;
  function fail(t){err.hidden=false;err.textContent=t;}
  function tryIt(){
    if(busy)return;var v=inp.value.trim();
    if(!/^\d{4}$/.test(v)){fail('الرمز أربعة أرقام.');return;}
    if(!sb){fail('الحفظ غير متاح في هذا العرض.');return;}
    busy=true;
    sb.rpc('admin_plans',{p_code:v}).then(function(res){
      busy=false;
      if(res.error){
        if(/bad_code/.test(res.error.message||'')){fail('الرمز غلط. حاول مرة ثانية.');inp.value='';inp.focus();}
        else fail('ما قدرنا نتحقق من الرمز.');
        return;
      }
      try{sessionStorage.setItem('safra-admin-code',v);sessionStorage.setItem('safra-admin-ok','1');}catch(e){}
      openAdmin();
    },function(){busy=false;fail('ما قدرنا نتحقق من الرمز.');});
  }
  b.addEventListener('click',tryIt);
  inp.addEventListener('keydown',function(e){if(e.key==='Enter')tryIt();});
  inp.addEventListener('input',function(){inp.value=inp.value.replace(/\D/g,'').slice(0,4);if(inp.value.length===4)tryIt();});
  root.appendChild(c);
  setTimeout(function(){try{inp.focus({preventScroll:true});}catch(e){}},50);
}

/* ---- several plans into one PDF, one A4 page each ---- */
function downloadMany(list,btn,msg,filename){
  msg.hidden=true;btn.disabled=true;var old=btn.textContent;btn.textContent='جاري التجهيز...';
  var fail=function(t){msg.hidden=false;msg.className='note warn';msg.textContent=t;btn.disabled=false;btn.textContent=old;};
  var libs=Promise.resolve();
  if(!window.html2canvas)libs=libs.then(function(){return loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');});
  if(!(window.jspdf&&window.jspdf.jsPDF))libs=libs.then(function(){return loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');});
  var dlP=Promise.resolve({save:saveBlobPromise});
  Promise.all([libs,dlP]).then(function(r){
    var dls=r[1];
    if(!dls){fail('التنزيل غير متاح في هذا العرض. افتح الصفحة من تطبيق Claude أو من الرابط مباشرة.');return;}
    if(!list.length){fail('ما فيه خطط لتنزيلها.');return;}
    var pdf=new window.jspdf.jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
    var seq=Promise.resolve();
    list.forEach(function(m,i){
      seq=seq.then(function(){
        var stage=el('div','');stage.style.cssText='position:fixed;left:-10000px;top:0;';
        var sheet=buildSheet(m);stage.appendChild(sheet);document.body.appendChild(stage);fitSheet(sheet);
        return window.html2canvas(sheet,{scale:2,backgroundColor:'#ffffff',useCORS:true}).then(function(canvas){
          document.body.removeChild(stage);
          if(i>0)pdf.addPage();
          pdf.addImage(canvas.toDataURL('image/jpeg',0.92),'JPEG',0,0,210,297);
        },function(e){if(stage.parentNode)stage.parentNode.removeChild(stage);throw e;});
      });
    });
    return seq.then(function(){return dls.save({filename:filename,data:pdf.output('blob')});}).then(function(){btn.disabled=false;btn.textContent=old;},function(e){
      if(e&&e.code==='declined'){btn.disabled=false;btn.textContent=old;return;}
      fail('ما قدرنا ننزل الملف. جرب مرة ثانية.');
    });
  }).catch(function(){fail('ما قدرنا نجهز الملف. تأكد من الإنترنت وجرب مرة ثانية.');});
}

/* ---- boot ---- */
function loadFromData(d){
  S.name=d.name||S.name;S.entries=Array.isArray(d.entries)?d.entries:[];S.pos=typeof d.pos==='number'?d.pos:covered(S.entries);
  S.done=!!d.done;S.seenDay2=!!d.seenDay2;
}
var local=lsGet();
if(local&&local.entries&&local.entries.length){loadFromData(local);S.started=true;S.screen=S.done?'summary':'welcome';}
render();

try{if(window.supabase&&SAFRA.url.indexOf('__')!==0){sb=window.supabase.createClient(SAFRA.url,SAFRA.anonKey);}}catch(e){sb=null;}
dbMode=sb?'on':'off';
})();
